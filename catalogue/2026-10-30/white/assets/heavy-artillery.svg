<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Modern towed howitzer: long barrel with recoil cylinder and two-baffle muzzle brake,
       armored gun shield with camo, optics box, split trail and heavy wheels. -->
  <defs>
    <linearGradient id="olive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#808d4b"/>
      <stop offset="1" stop-color="#4a5426"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#97a45d"/>
      <stop offset="0.45" stop-color="#5f6b30"/>
      <stop offset="1" stop-color="#363d1c"/>
    </linearGradient>
  </defs>
  <g stroke="#1c200e" stroke-width="2" stroke-linejoin="round">
    <!-- split trail legs with spades -->
    <path d="M40 66 L6 84 L8 90 L44 73 Z" fill="url(#olive)"/>
    <path d="M4 82 L10 80 L12 92 L6 94 Z" fill="#363d1c"/>
    <path d="M48 70 L20 90 L24 94 L54 75 Z" fill="#434b22"/>
    <!-- barrel assembly, raised ~32 degrees around the trunnion -->
    <g transform="rotate(-32 46 56)">
      <rect x="40" y="52" width="58" height="10" rx="2" fill="url(#barrel)"/>
      <rect x="40" y="45.5" width="34" height="6" rx="3" fill="#6b7838"/>
      <rect x="28" y="47" width="24" height="17" rx="3" fill="url(#olive)"/>
      <rect x="92" y="49" width="4" height="16" rx="1" fill="#2e3418"/>
      <rect x="97" y="49" width="4" height="16" rx="1" fill="#2e3418"/>
    </g>
    <!-- armored gun shield / cradle with camo -->
    <path d="M30 50 L56 43 L62 70 L32 73 Z" fill="url(#olive)"/>
    <path d="M36 52 Q42 49 46 53 Q43 58 37 57 Z M48 60 Q54 57 57 62 Q53 66 48 64 Z M35 64 Q39 61 43 65 Q39 69 35 68 Z"
          fill="#3b4220" stroke="none"/>
    <!-- optics box -->
    <rect x="52" y="38" width="9" height="7" rx="1.5" fill="#434b22"/>
    <circle cx="59" cy="41.5" r="1.8" fill="#9fd3ff" stroke-width="1"/>
    <!-- heavy wheels -->
    <circle cx="40" cy="76" r="15" fill="#22261a"/>
    <circle cx="40" cy="76" r="7.5" fill="#6b7638"/>
    <circle cx="40" cy="76" r="2.5" fill="#22261a" stroke-width="1"/>
    <circle cx="62" cy="79" r="12" fill="#22261a"/>
    <circle cx="62" cy="79" r="6" fill="#6b7638"/>
  </g>
  <!-- tire tread -->
  <g stroke="#4a4f38" stroke-width="1.6" fill="none">
    <path d="M40 62.5 v3.5 M40 86 v3.5 M26.5 76 h3.5 M50 76 h3.5 M30.5 66.5 l2.5 2.5 M47 83 l2.5 2.5 M30.5 85.5 l2.5 -2.5 M47 69 l2.5 -2.5"/>
  </g>
</svg>
